<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DASS HOME</title>
<meta name="description" content="DASS HOME — учёт и продажи шоурума: вход в аккаунт, роль подбирается автоматически.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#241C15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DASS HOME">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<style>
  :root{
    --bg:#F6F0E3;--surface:#FFFFFF;--border:#E3D8C0;--text:#241E17;--text-muted:#7C7062;
    --accent:#B4924F;--accent-hover:#96793D;--accent-contrast:#FFFFFF;--accent-soft:#F0E3C5;
    --hero-bg:#241C15;--hero-text:#F7F0E2;
    --danger:#B3452F;--danger-soft:#F6DED6;
    --shadow-1:0 1px 2px rgba(36,28,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#120E0A;--surface:#1C1611;--border:#332A20;--text:#F3ECDF;--text-muted:#A79B87;
      --hero-bg:#0E0B08;--hero-text:#F3ECDF;
      --danger-soft:#3A211B;
    }
  }
  :root[data-theme="dark"]{
    --bg:#120E0A;--surface:#1C1611;--border:#332A20;--text:#F3ECDF;--text-muted:#A79B87;
    --hero-bg:#0E0B08;--hero-text:#F3ECDF;
    --danger-soft:#3A211B;
  }
  /* Логотип на тёмном фоне — отдельная светлая версия картинки, переключается тем же
     условием, что и цвета выше (системная тёмная тема ИЛИ вручную выбранная). */
  img[data-dark-logo]{display:none!important}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) img[data-light-logo]{display:none!important}
    :root:not([data-theme="light"]) img[data-dark-logo]{display:inline!important}
  }
  :root[data-theme="dark"] img[data-light-logo]{display:none!important}
  :root[data-theme="dark"] img[data-dark-logo]{display:inline!important}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}

  .frame-wrap{flex:1;min-height:0;position:relative;background:var(--bg)}
  .frame-wrap iframe{border:none;width:1px;min-width:100%;max-width:100%;height:100%;display:block;background:var(--bg)}
  .frame-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text-muted);font:600 12.5px/1 'Public Sans',sans-serif;gap:8px;
    opacity:0;pointer-events:none;transition:opacity .15s ease}
  .frame-loading[data-show="true"]{opacity:1}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @font-face{font-family:'Sora';src:local('Sora')}

  /* ---- Login view ---- */
  .app-view, .login-view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
  .app-view[hidden], .login-view[hidden]{display:none}
  .login-view{align-items:center;justify-content:center;padding:20px;overflow:auto;background:var(--bg)}
  .login-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow-1);padding:26px 24px}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .login-mark{width:34px;height:34px;object-fit:contain;flex:none}
  .login-wordmark{height:18px;object-fit:contain;display:block}
  .login-title{font:700 18px/1.3 'Sora',sans-serif;margin:0 0 4px}
  .login-sub{font:500 13px/1.4 'Public Sans',sans-serif;color:var(--text-muted);margin:0 0 20px}
  .login-field{margin-bottom:14px}
  .login-field label{display:block;font:600 12px/1 'Public Sans',sans-serif;color:var(--text-muted);margin-bottom:6px}
  .login-field input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
    color:var(--text);font:500 14px/1.2 'Public Sans',sans-serif;outline:none}
  .login-field input:focus{border-color:var(--accent)}
  .login-submit{width:100%;margin-top:6px;padding:12px;border:none;border-radius:10px;background:var(--accent);
    color:var(--accent-contrast);font:700 14px/1 'Public Sans',sans-serif;cursor:pointer}
  .login-submit:hover{background:var(--accent-hover)}
  .login-submit:disabled{opacity:.6;cursor:default}
  .login-error{display:none;margin-bottom:14px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);
    color:var(--danger);font:600 12.5px/1.4 'Public Sans',sans-serif}
  .login-error[data-show="true"]{display:block}
  /* iPhone: поля с шрифтом меньше 16px заставляют Safari приближать страницу при вводе (и она «ездит» вбок);
     горизонтальная прокрутка страницы запрещена — широкие таблицы листаются внутри своих рамок. */
  html,body{max-width:100%;overflow-x:hidden}
  @supports (-webkit-touch-callout:none){ input,select,textarea{font-size:16px!important} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-view" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-logo">
        <img class="login-mark" src="icons/brand-mark.png" alt="" data-light-logo>
        <img class="login-mark" src="icons/brand-mark-dark.png" alt="" data-dark-logo>
        <img class="login-wordmark" src="icons/brand-wordmark.png" alt="DASS HOME" data-light-logo>
        <img class="login-wordmark" src="icons/brand-wordmark-dark.png" alt="DASS HOME" data-dark-logo>
      </div>
      <h1 class="login-title">Вход в систему</h1>
      <p class="login-sub">Учёт и продажи шоурума</p>
      <div class="login-error" id="loginError"></div>
      <div class="login-field">
        <label for="loginLogin">Логин</label>
        <input type="text" id="loginLogin" name="login" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
      </div>
      <button class="login-submit" id="loginSubmit" type="submit">Войти</button>
    </form>
  </div>

  <div class="app-view" id="appView" hidden>
    <div class="frame-wrap">
      <iframe id="appFrame" title="DASS HOME"></iframe>
      <div class="frame-loading" id="frameLoading"><span class="spinner"></span>Загрузка…</div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  /* Тестовый контур (песочница): ?env=test — отдельные таблицы OWNER/MANAGERS (ТЕСТ), отдельное развёртывание
     и отдельная сессия, чтобы вход в песочницу не подменял рабочий вход. */
  /* Папка /test/ на Pages — непроверенный фронтенд, всегда в тестовом контуре. */
  var IS_TEST = /[?&]env=test(&|$)/.test(location.search) || /\/test\//.test(location.pathname);
  var API_BASE = IS_TEST
    ? 'https://script.google.com/macros/s/AKfycbz36SRB8Pm5XvEpjTjnim6RgVeB2Ek4R25s0Bz-Lb7DIhYvnlq1TKCx0ARNB34JWIjN-w/exec'
    : 'https://script.google.com/macros/s/AKfycbxJWwv2rbycjNHdILaqaw6w6qZDChHmqk-JtaA8t3SmAEaTsQUV_BbS2Yar9-ahut8/exec';
  var PAGES = { owner: 'owner.html', manager: 'manager.html', investor: 'owner.html' };
  var STORAGE_KEY = IS_TEST ? 'dass_home_session_test' : 'dass_home_session';
  if (IS_TEST) {
    document.title = 'DASS HOME · ТЕСТ';
    var bar = document.createElement('div');
    bar.textContent = 'ТЕСТОВЫЙ КОНТУР — данные не попадают в рабочий учёт';
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b3261e;color:#fff;font:600 12px/1.2 system-ui,sans-serif;text-align:center;letter-spacing:.04em;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))';
    document.body.appendChild(bar);
  }

  var loginView = document.getElementById('loginView');
  var appView = document.getElementById('appView');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var loginSubmit = document.getElementById('loginSubmit');
  var frame = document.getElementById('appFrame');
  var loading = document.getElementById('frameLoading');

  function getSession(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(e){ return null; }
  }
  function saveSession(session){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(session)); } catch(e){}
  }
  function clearSession(){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  }

  function showLogin(message){
    appView.hidden = true;
    loginView.hidden = false;
    frame.removeAttribute('data-src');
    frame.src = 'about:blank';
    if (message) {
      loginError.textContent = message;
      loginError.setAttribute('data-show', 'true');
    } else {
      loginError.setAttribute('data-show', 'false');
    }
    var pwd = document.getElementById('loginPassword');
    if (pwd) pwd.value = '';
    var lg = document.getElementById('loginLogin');
    if (lg) setTimeout(function(){ lg.focus(); }, 50);
  }

  function showApp(session){
    loginView.hidden = true;
    appView.hidden = false;
    var page = PAGES[session.role] || 'owner.html';
    var src = page + '?token=' + encodeURIComponent(session.token) + '&name=' + encodeURIComponent(session.name || '') + '&login=' + encodeURIComponent(session.login || '') + '&role=' + encodeURIComponent(session.role || '') + (IS_TEST ? '&env=test' : '');
    loading.setAttribute('data-show', 'true');
    frame.setAttribute('data-src', src);
    frame.src = src;
  }

  frame.addEventListener('load', function(){
    loading.setAttribute('data-show', 'false');
  });

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    var login = document.getElementById('loginLogin').value.trim();
    var password = document.getElementById('loginPassword').value;
    if (!login || !password) return;
    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Проверка…';
    loginError.setAttribute('data-show', 'false');
    fetch(API_BASE, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', login: login, password: password })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'Не удалось войти.');
        var session = { token: j.data.token, role: j.data.role, name: j.data.name, login: j.data.login };
        saveSession(session);
        showApp(session);
      })
      .catch(function (err) {
        showLogin(err.message || 'Не удалось войти. Проверьте логин и пароль.');
      })
      .then(function () {
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'Войти';
      });
  });

  window.addEventListener('message', function(e){
    var data = e.data || {};
    if (data.type === 'dass-logout') {
      clearSession();
      showLogin();
    } else if (data.type === 'dass-session-expired') {
      clearSession();
      showLogin('Сессия истекла. Войдите снова.');
    }
  });

  var existing = getSession();
  if (existing && existing.token) {
    showApp(existing);
  } else {
    showLogin();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('SW registration failed:', e);
      });
    });
  }
})();
</script>
</body>
</html>
